aid: crossoverhealth
name: Crossoverhealth
description: 'Crossover Health is an advanced primary care provider that delivers
  integrated, team-based healthcare for employers and their members through its proprietary
  Care Platform. Its services span primary care, physical medicine, mental health,
  health coaching, care navigation, and occupational medicine, delivered through on-site
  and near-site health centers and a 50-state virtual provider network. Crossover Health
  is a portfolio company of Norwest Venture Partners and is tracked in the API Evangelist
  network as a company profile; no public developer API, developer portal, or machine-readable
  specification has been found on its web properties.'
